version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: legal-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: legal-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - chroma_data:/app/data/chroma
      - raw_data:/app/data/raw

volumes:
  ollama_data:
    name: legal_rag_ollama_data
  chroma_data:
    name: legal_rag_chroma_data
  raw_data:
    name: legal_rag_raw_data


